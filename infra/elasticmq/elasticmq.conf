# Filas de desenvolvimento (ElasticMQ). Na AWS, as mesmas filas e parâmetros vêm de infra/.
include classpath("application.conf")

queues {
  # Visibility timeout padrão; o worker sobrescreve a cada receive com queue.visibility-timeout-ms.
  prioritaria {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "dlq", maxReceiveCount = 5 }
  }
  normal {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "dlq", maxReceiveCount = 5 }
  }
  # FIFO_COMPARTILHADO: fila única para as duas classes.
  unica {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "dlq", maxReceiveCount = 5 }
  }
  dlq { }
}
