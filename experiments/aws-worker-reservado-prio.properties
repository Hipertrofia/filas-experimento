# SQS, pod reservado de RESERVADO(k): prioritária primeiro, normal quando ela está vazia (polling curto nas duas, pausa de 5 ms, como em PRIORIDADE).
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=RESERVADO
worker.queues=prioritaria,normal
service.mode=SLEEP

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.wait-ms=0
worker.idle-pause-ms=5

sink.flush-ms=200
shutdown.timeout-ms=30000
