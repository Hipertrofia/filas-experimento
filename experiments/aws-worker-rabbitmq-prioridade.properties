# Pod worker na AWS consumindo do broker RabbitMQ da stack. Um job por vez por pod: c = número de
# instâncias worker. Mesmo trace da fumaça SQS c = 1, para comparar lado a lado:
#   infra/aws/capacidade.sh 1 1 1
#   infra/aws/rodada.sh experiments/aws-worker-rabbitmq-prioridade.properties experiments/aws-fumaca-c1-rabbitmq.properties
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh; a URI do
# broker (RABBITMQ_URI), do objeto broker/rabbitmq.env no bucket.

worker.threads=1
worker.policy=PRIORIDADE
worker.queues=jobs
service.mode=SLEEP

queue.backend=RABBITMQ
rabbitmq.priority-queues=jobs
# Push com prefetch = 1: a espera só define a rapidez com que o worker vê um pedido de parada.
queue.wait-ms=500

sink.flush-ms=200
shutdown.timeout-ms=30000
