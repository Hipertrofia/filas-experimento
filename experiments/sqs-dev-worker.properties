# Worker contra o ElasticMQ local (infra/elasticmq). As chegadas vêm do generator-app:
#   docker compose -f infra/elasticmq/docker-compose.yml up -d
#   ./gradlew :worker-app:run --args="experiments/sqs-dev-worker.properties"
#   ./gradlew :generator-app:run --args="send experiments/sqs-dev-fumaca.properties"

worker.id=dev
worker.threads=2
worker.policy=PRIORIDADE
worker.queues=prioritaria,normal
service.mode=CPU_BURN

queue.backend=SQS
sqs.endpoint=http://localhost:9324
sqs.region=us-east-1

# Estratégia de polling: curto nas duas filas, com pausa de 5 ms quando ambas vêm vazias.
# Comparação no ElasticMQ (trace polling-s2, ρ = 0,6, c = 2), E[Wq] prio / normal:
#   memória (referência)            49 / 112 ms
#   curto + pausa 5 ms (esta)       54 / 125 ms   ~300 receives/s para 2 workers
#   prio curto, normal long 1 s    178 / 143 ms   vazamento: worker ocioso preso no polling da normal
#   prio long 1 s, normal curto      4 / 127 s    instável: cada job normal custa 1 s de polling
# Uma espera > 0 em qualquer fila que não seja a última bloqueia as seguintes.
# No SQS real o polling curto consulta só parte dos servidores: confirmar na AWS.
queue.wait-ms=0
queue.wait-ms.prioritaria=0
worker.idle-pause-ms=5
queue.visibility-timeout-ms=30000

sink.file=registros/sqs-dev.jsonl
sink.flush-ms=200
shutdown.timeout-ms=30000
