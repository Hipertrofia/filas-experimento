# SQS, fila única (FIFO compartilhado). Com uma fila só, long polling de 1 s não vaza prioridade: o receive volta assim que chega uma mensagem.
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=FIFO_COMPARTILHADO
worker.queues=unica
service.mode=SLEEP

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.wait-ms=1000

sink.flush-ms=200
shutdown.timeout-ms=30000
