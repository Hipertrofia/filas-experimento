# Pod worker na AWS com fila única (FIFO compartilhado). Usar com um gerador que mande as duas
# classes para a fila "unica" (queue.priority=unica, queue.normal=unica).

worker.threads=1
worker.policy=FIFO_COMPARTILHADO
worker.queues=unica
service.mode=SLEEP

queue.backend=SQS
queue.wait-ms=0
worker.idle-pause-ms=5
queue.visibility-timeout-ms=30000

sink.flush-ms=200
shutdown.timeout-ms=30000
