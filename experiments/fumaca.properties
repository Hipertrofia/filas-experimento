# Rodada de fumaça: poucos segundos, só para conferir o encadeamento gerador → worker.
# Gerar o trace:  ./gradlew :generator-app:run --args="generate experiments/fumaca.properties"

run.id=fumaca-s1
seed=1
horizon-s=5

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=2
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/fumaca-s1.csv

# Envio (fase SQS)
queue.backend=SQS
queue.priority=prioritaria
queue.normal=normal
