# Worker contra o RabbitMQ local (infra/rabbitmq). As chegadas vêm do generator-app:
#   docker compose -f infra/rabbitmq/docker-compose.yml up -d
#   ./gradlew :worker-app:run --args="experiments/rabbitmq-dev-worker.properties"
#   ./gradlew :generator-app:run --args="send experiments/rabbitmq-dev-fumaca.properties"
#
# Push (basic.consume, prefetch = 1) numa fila só, declarada com x-max-priority: a prioridade
# não-preemptiva é do broker, sem polling e sem ordem de consulta entre filas.

worker.id=dev
worker.threads=1
worker.policy=PRIORIDADE
worker.queues=jobs
# No Windows o timer do sleep atrasa ~1 ms ou mais; CPU_BURN é preciso.
service.mode=CPU_BURN

queue.backend=RABBITMQ
rabbitmq.uri=amqp://guest:guest@localhost:5672
rabbitmq.priority-queues=jobs
# Só define a rapidez com que o worker vê um pedido de parada: a entrega é empurrada pelo broker.
queue.wait-ms=500

sink.file=registros/rabbitmq-dev/dev.jsonl
sink.flush-ms=200
shutdown.timeout-ms=30000
worker.exit-after-idle-ms=5000
