# RabbitMQ, pod reservado de RESERVADO(k): pull (basic.get) na prioritária e depois na normal, pausa de 1 ms quando as duas vêm vazias.
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=RESERVADO
worker.queues=prioritaria,normal
service.mode=SLEEP

queue.backend=RABBITMQ
queue.wait-ms=0
worker.idle-pause-ms=1

sink.flush-ms=200
shutdown.timeout-ms=30000
