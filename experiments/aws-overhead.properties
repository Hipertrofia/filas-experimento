# Overhead do SQS: serviço zero, só o custo de receive + delete + transporte.
# E[W] medido aqui é o que o SQS soma ao serviço de cada job (CLAUDE.md, cuidados com a medição).
# Taxas explícitas porque com E[S] = 0 não dá para derivar λ de ρ.

run.id=aws-overhead-s1
seed=1
horizon-s=120

arrival.rate-per-s.priority=10
arrival.rate-per-s.normal=10
size.mean-ms.priority=0
size.mean-ms.normal=0

trace.file=experiments/traces/aws-overhead-s1.csv

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.priority=prioritaria
queue.normal=normal
