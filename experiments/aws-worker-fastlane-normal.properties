# SQS, pod normal da FAST_LANE_FISICA: só a fila normal, long polling de 1 s.
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=FAST_LANE_FISICA
worker.queues=normal
service.mode=SLEEP

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.wait-ms=1000

sink.flush-ms=200
shutdown.timeout-ms=30000
