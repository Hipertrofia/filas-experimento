# RabbitMQ, pod da fast lane: só a fila prioritária, push com prefetch = 1.
# worker.id, sink.file e worker.exit-after-idle-ms vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=FAST_LANE_FISICA
worker.queues=prioritaria
service.mode=SLEEP

queue.backend=RABBITMQ
queue.wait-ms=500

sink.flush-ms=200
shutdown.timeout-ms=30000
