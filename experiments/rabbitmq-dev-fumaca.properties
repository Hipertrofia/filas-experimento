# Envio do trace de fumaça ao RabbitMQ local (ver experiments/rabbitmq-dev-worker.properties).
# c = 1 para comparar com Cobham exato, como a fumaça c = 1 da AWS.

run.id=rabbitmq-dev-c1-s1
seed=1
horizon-s=120

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=1
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/rabbitmq-dev-c1-s1.csv

# As duas classes vão para a mesma fila; a prioridade vai na mensagem.
queue.backend=RABBITMQ
rabbitmq.uri=amqp://guest:guest@localhost:5672
rabbitmq.priority-queues=jobs
queue.priority=jobs
queue.normal=jobs
