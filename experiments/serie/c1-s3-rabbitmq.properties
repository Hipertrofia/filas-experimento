# Série de réplicas: c = 1, seed 3, fila rabbitmq. Mesmo trace para SQS e RabbitMQ.
#   infra/aws/rodada.sh experiments/aws-worker-rabbitmq-prioridade.properties experiments/serie/c1-s3-rabbitmq.properties

run.id=aws-fumaca-c1-s3
seed=3
horizon-s=120

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=1
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/aws-fumaca-c1-s3.csv

queue.backend=RABBITMQ
rabbitmq.priority-queues=jobs
queue.priority=jobs
queue.normal=jobs
