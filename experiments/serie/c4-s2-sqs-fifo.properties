# Série c = 4, seed 2, SQS, FIFO compartilhado: as duas classes na fila unica.

run.id=aws-c4-s2
seed=2
horizon-s=120

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=4
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/aws-c4-s2.csv

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.priority=unica
queue.normal=unica
