# Comparação de estratégias de polling (vazamento de prioridade) no ElasticMQ local.

run.id=polling-s2
seed=2
horizon-s=60

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=2
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/polling-s2.csv

# Envio (fase SQS)
queue.backend=SQS
sqs.endpoint=http://localhost:9324
sqs.region=us-east-1
queue.visibility-timeout-ms=30000
queue.priority=prioritaria
queue.normal=normal
