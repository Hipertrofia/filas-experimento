# Pod worker na AWS (infra/aws). Um job por vez por pod: c = número de instâncias worker.
#   infra/aws/rodada.sh experiments/aws-worker-prioridade.properties experiments/aws-fumaca.properties
# worker.id, sink.file, worker.exit-after-idle-ms e sqs.region vêm do infra/aws/remoto/worker.sh.

worker.threads=1
worker.policy=PRIORIDADE
worker.queues=prioritaria,normal

# No Linux o sleep é preciso (o atraso de ~11 ms era do timer do Windows).
service.mode=SLEEP

queue.backend=SQS
# Polling curto nas duas filas com pausa de 5 ms, como no ElasticMQ (ver sqs-dev-worker.properties).
# Pendência: confirmar na AWS, onde o polling curto consulta só parte dos servidores do SQS.
queue.wait-ms=0
queue.wait-ms.prioritaria=0
worker.idle-pause-ms=5
queue.visibility-timeout-ms=30000

sink.flush-ms=200
shutdown.timeout-ms=30000
