# Worker local com replay do trace no próprio processo (a fila em memória não é visível
# para outro processo). c = 2 workers, como em experiments/fumaca.properties.
#   ./gradlew :worker-app:run --args="experiments/local-prioridade.properties"

worker.id=local
worker.threads=2
worker.policy=PRIORIDADE
worker.queues=prioritaria,normal

# SLEEP no Windows atrasa ~11 ms por job (granularidade do timer); CPU_BURN é preciso.
service.mode=CPU_BURN

queue.backend=LOCAL
# Espera do receive por fila: curta na prioritária para não segurar o worker,
# e o long polling na normal é o ponto de vazamento de prioridade em estudo.
queue.wait-ms=20
queue.wait-ms.prioritaria=0
queue.visibility-timeout-ms=30000

sink.file=registros/local-prioridade.jsonl
sink.flush-ms=200
shutdown.timeout-ms=30000

local.trace=experiments/traces/fumaca-s1.csv
local.queue.priority=prioritaria
local.queue.normal=normal
local.exit-when-drained=true
