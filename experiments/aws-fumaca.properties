# Rodada de fumaça na AWS: 60 s, só para conferir o encadeamento. c = 2 pods worker.

run.id=aws-fumaca-s1
seed=1
horizon-s=60

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=2
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/aws-fumaca-s1.csv

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.priority=prioritaria
queue.normal=normal
