# Fumaça c = 1 na AWS com o broker RabbitMQ. Mesmo run.id, seed e trace da fumaça SQS
# (aws-fumaca-c1.properties), só muda o envio: as duas classes vão para a fila jobs, com a
# prioridade na mensagem.
#   infra/aws/rodada.sh experiments/aws-worker-rabbitmq-prioridade.properties experiments/aws-fumaca-c1-rabbitmq.properties

run.id=aws-fumaca-c1-s1
seed=1
horizon-s=120

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=1
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/aws-fumaca-c1-s1.csv

queue.backend=RABBITMQ
rabbitmq.priority-queues=jobs
queue.priority=jobs
queue.normal=jobs
