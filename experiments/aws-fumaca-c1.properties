# Fumaça na AWS com um servidor (c = 1): P-K e Cobham são exatos, então a rodada valida a
# infra inteira contra a teoria sem a incerteza das aproximações de c > 1.
#   infra/aws/capacidade.sh 1 1
#   infra/aws/rodada.sh experiments/aws-worker-prioridade.properties experiments/aws-fumaca-c1.properties

run.id=aws-fumaca-c1-s1
seed=1
horizon-s=120

# λ = ρ·c / E[S], E[S] = p·20 + (1 − p)·200 ms
load.rho=0.6
load.servers=1
load.mix-priority=0.5

size.mean-ms.priority=20
size.mean-ms.normal=200
slice.count.priority=1
slice.count.normal=1

trace.file=experiments/traces/aws-fumaca-c1-s1.csv

queue.backend=SQS
queue.visibility-timeout-ms=30000
queue.priority=prioritaria
queue.normal=normal
